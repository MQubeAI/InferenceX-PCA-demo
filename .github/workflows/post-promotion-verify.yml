name: Verify promoted InferenceX checkpoint

on:
  push:
    branches: [main]
    paths:
      - data-manifest.json
      - data/artifact-index.json
      - data/manifests/**

permissions:
  contents: read

concurrency:
  group: promoted-inferencex-${{ github.sha }}
  cancel-in-progress: false

jobs:
  clean-clone-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Require empty local data and complete dashboard startup
        run: |
          rm -rf .data .artifacts
          python scripts/clean_clone_smoke_test.py
